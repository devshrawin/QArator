<!doctype html><html><head><title>Submit Bug - generic layout (mock)</title>
<style>body{font-family:sans-serif;padding:20px}.row{margin:8px 0}.ce{border:1px solid #999;min-height:80px;width:500px}.chip{background:#def;margin-right:4px}</style></head><body>
<form onsubmit="return false">
<div class="row"><label for="t">Bug Title</label> <input id="t" type="text" style="width:400px"></div>
<div class="row"><span>Description</span><div class="ce" contenteditable="true" id="d"></div></div>
<div class="row"><label for="sev">Severity</label> <select id="sev"><option value="">-None-</option><option value="1">Show stopper</option><option value="2">Critical</option><option value="3">Major</option><option value="4">Minor</option></select></div>
<div class="row"><label for="pri">Priority</label> <select id="pri"><option>None</option><option>Low</option><option>Medium</option><option>High</option></select></div>
<div class="row"><label for="cls">Classification</label> <select id="cls"><option>Issue</option><option>Bug</option></select></div>
<div class="row"><label for="tp">Test Phase</label> <select id="tp"><option>Smoke</option><option>Sanity</option></select></div>
<div class="row"><label for="dev">Device Type</label> <select id="dev"><option>Mobile</option><option>Web Application</option></select></div>
<div class="row"><label for="rep">Is it reproducible</label> <select id="rep"><option>None</option><option>Always</option></select></div>
<div class="row"><label for="fl">Flag</label> <select id="fl"><option>Internal</option><option>External</option></select></div>
<div class="row"><div><span>Tags</span> <span id="chips"></span><input id="tags"></div></div>
<div class="row"><label>Attach <input type="file" id="att"></label></div>
</form>
<script>
const tags = document.getElementById('tags'), chips = document.getElementById('chips');
tags.addEventListener('keydown', (e) => { if (e.key === 'Enter' && tags.value.trim()) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = tags.value.trim(); chips.appendChild(c); tags.value = ''; } });
</script>
</body></html>
